map $http_upgrade $codex_mesh_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 127.0.0.1:8443 ssl http2 proxy_protocol;
    server_name cm.cs.ray17.top;

    set_real_ip_from 127.0.0.1;
    real_ip_header proxy_protocol;

    ssl_certificate     /etc/nginx/ssl/cs.ray17.top/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/cs.ray17.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 10m;
    access_log /var/log/nginx/codex-mesh.access.log;
    error_log  /var/log/nginx/codex-mesh.error.log;

    location / {
        proxy_pass http://127.0.0.1:18787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $codex_mesh_connection_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

